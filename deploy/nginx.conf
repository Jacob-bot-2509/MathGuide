# MathGuide 生产部署示例(Nginx)· 双域隔离
#
#   learn.example.com     学习辅助
#   research.example.com  科学研究
# 两个子域服务同一份前端构建与同一个后端;浏览器 storage 按 origin 天然隔离。
# 登录态由后端写入父域 Cookie,需在后端 .env.local 配置:
#   MG_COOKIE_DOMAIN=.example.com
# CORS 不需要配置:两个子域的 /api 都同域反代,浏览器视为同源。
#
# 前置:前端 npm run build,root 指向 frontend/dist;
# 后端只绑 127.0.0.1:8000,MG_DEMO_MODE=0。
# 证书需同时覆盖两个子域(SAN 或通配符);路径按实际修改。
# 首次上线先注释 HSTS,确认 HTTPS 正常后再打开。

server {
    listen 80;
    server_name learn.example.com research.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name learn.example.com research.example.com;

    ssl_certificate     /etc/letsencrypt/live/example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/example.com/privkey.pem;

    root /srv/mathguide/frontend/dist;
    index index.html;

    # 论文上传上限 100 MB(与 MG_RESEARCH_MAX_UPLOAD_MB 对齐);
    # 教材按章读取的单章 JSON 约 600 KB,也在这个上限内。
    client_max_body_size 100m;

    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 真实 IP 必须原样追加:后端按 client_ip.py 的规则取值 ——
        #   「直连对端在 MG_TRUSTED_PROXIES 里 → 从右往左取第一个不在白名单里的地址」,
        # 所以少了这一行,所有用户会塌成一个 IP(全站共享登录 10 次/分);
        # 而客户端自己伪造的 X-Forwarded-For 会被这一行追加的真实地址压住,伪造无效。
        # 反代地址要同时写进后端 .env.local 的 MG_TRUSTED_PROXIES。
        # 前面再挂 CDN 时:要么把 CDN 回源网段也加进 MG_TRUSTED_PROXIES,
        # 要么在这里配 set_real_ip_from <CDN网段> + real_ip_header CF-Connecting-IP + real_ip_recursive on。
        # 见 docs/DEPLOY_PLAYBOOK.md §一.4
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # SSE 不能缓冲
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Frame-Options "DENY" always;
    add_header Permissions-Policy "camera=(), geolocation=(), microphone=(self)" always;
    # KaTeX 会写内联 style,因此保留 style-src 'unsafe-inline';
    # 脚本与连接都限制在自身域名,前端已无内联脚本。
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; worker-src 'self' blob:; frame-ancestors 'none'; object-src 'none'; base-uri 'self'; form-action 'self'" always;
}
