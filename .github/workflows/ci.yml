name: ci

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: backend (py${{ matrix.python }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # 兜底:Linux 线曾出现过持仓 6 小时(默认上限)的情况,超过 20 分钟直接判失败,
    # 别再让一条挂死的 job 卡住整条流水线与 PR 状态。
    timeout-minutes: 20
    # 逃生闸门,给**未来的**前瞻解释器(如 3.15)用:新增矩阵项时写 `experimental: true`,
    # 该 job 失败只作信号、不阻塞合并。固定基线(3.13 / 3.14)不加这个标记 —— 红了就是真红。
    # 教训:一个"红着也没人管"的 job 等于没有这条线(v1.26.0 曾靠 Windows 线的假绿掩盖 Linux 挂起)。
    continue-on-error: ${{ matrix.experimental == true }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # 主环境:CI 基线
          - os: ubuntu-latest
            python: "3.13"
            cov_floor: 85
          # 3.14 是本地开发在用的解释器,这条线必须当真:它红了就说明本机能跑的东西 CI 跑不了。
          # analysis 三件套(scipy 1.14.1 / pandas 2.2.3 / statsmodels 0.14.4)没有 cp314 wheel,
          # pip 会退化成源码编译,再因缺 OpenBLAS 报 "Dependency OpenBLAS not found" 直接失败,
          # 整条线连测试都跑不起来。所以这里只装主依赖与测试依赖:analysis_regression 被
          # importorskip 跳过,它的覆盖由两条 3.13 基线守着;覆盖率不可比,故不设门槛。
          # 2026-11-15:此前挂着 8 条"环境性失败"、故标 experimental;今天两类缺口都补上了
          # (缺 numpy 的 worker 用例改 pytest.importorskip,浏览器打印由 pdf_render_available
          # 区分"有二进制"与"真能出 PDF"),该线已全绿,因此摘掉 experimental 转为门禁。
          # 将来要前瞻 3.15 时:新增一条矩阵项并写 `experimental: true`,不要动这一条。
          - os: ubuntu-latest
            python: "3.14"
            skip_analysis: true
            cov_floor: 0
          # 项目是 Windows 优先(dev.bat / GBK 控制台 / 路径处理),必须有一条 Windows 线
          - os: windows-latest
            python: "3.13"
            cov_floor: 85
          # macOS:大小写不敏感文件系统、无 /usr/bin/chromium、信号量与 fork 语义都不同,
          # 这三类差异只会在这条线上暴露(用户里有不少 Mac 本地起服务)。
          # 覆盖率口径与 Linux 一致,门槛同样 85;预算 20 分钟对 macOS 偏紧,
          # 超时就先看是不是"挂起"而不是"慢",别直接放宽。
          - os: macos-latest
            python: "3.13"
            cov_floor: 85
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install dependencies
        # analysis 依赖必须装:analysis_regression 的测试用 importorskip 守着,
        # 不装就整个文件被静默跳过 —— 覆盖率永远是 0 且没人会发现。
        if: ${{ !matrix.skip_analysis }}
        run: python -m pip install -r backend/requirements.txt -r backend/requirements-dev.txt -r backend/requirements-analysis.txt
      - name: Install dependencies (preview, 跳过 analysis)
        if: ${{ matrix.skip_analysis }}
        run: python -m pip install -r backend/requirements.txt -r backend/requirements-dev.txt
      - name: Lint (ruff)
        working-directory: backend
        run: ruff check .
      - name: rlimit 静态守卫(进程内不许改 rlimit)
        # 只在子进程启动脚本里设 rlimit(analysis_client.py)。主进程里调 setrlimit
        # 会让 uvicorn 整体挂起且无日志,这条检查把该类写法挡在合并之前。
        working-directory: backend
        run: python tools/lint_rlimits.py
      - name: 探测 analysis 依赖是否已支持本解释器
        # 3.14 前瞻线跳过了 scipy/pandas/statsmodels(没有 cp314 wheel)。
        # 这一步不阻塞:等上游出了 wheel,日志里会出现一条 warning 提醒去掉 skip_analysis。
        if: ${{ matrix.skip_analysis }}
        continue-on-error: true
        run: |
          if python -m pip install --dry-run --only-binary=:all: -r backend/requirements-analysis.txt > /dev/null 2>&1; then
            echo "::warning::analysis 依赖已支持本解释器,可以把 skip_analysis 去掉(见 docs/COVERAGE_PLAN.md §2)"
          else
            echo "::notice::analysis 依赖仍无本解释器 wheel,维持豁免"
          fi
      - name: Compile
        run: python -m compileall -q backend
      - name: Test
        working-directory: backend
        # 覆盖率门槛只用来**防倒退**(实测 90%,门槛设 85%)。
        # 单文件是否达标看 docs/COVERAGE_PLAN.md §2 的类别线,不看这个总数。
        # 门槛按矩阵项取值:3.14 前瞻线缺 analysis 依赖,覆盖率不可比,取 0(即不设门槛)。
        # PYTHONUNBUFFERED:管道里的 pytest 进度默认被 8KB 缓冲吃掉,挂起时日志一片空白;
        # 关掉缓冲后,取消 job 拿到的部分日志能直接指出卡在哪个用例。
        env:
          PYTHONUNBUFFERED: "1"
          # Ubuntu 23.10+ 默认 kernel.apparmor_restrict_unprivileged_userns=1,非 root 起不来
          # Chromium 沙箱 → 浏览器在、却打印不出 PDF(doc 导出相关用例会因此挂)。
          # 只在测试环境放开;生产不设这个变量,沙箱保持开启。
          MG_EDGE_NO_SANDBOX: "1"
        # 用 -v 而不是 -q:Linux 线出现过"Test 步骤无声挂起",-v + 无缓冲后即便中途取消 job,
        # 部分日志也能直接指出最后一条未完成的用例。
        run: python -m pytest -v --cov --cov-report=term-missing --cov-fail-under=${{ matrix.cov_floor }}

  frontend:
    name: frontend (node 22)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # vite 7 需要 20.19+/22.12+,eslint 10 需要 ^20.19/^22.13/>=24;
          # 固定在 22 这条 LTS 线上,避免 20 的小版本差异
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint (eslint)
        run: npm run lint
      - name: Type check
        run: npx vue-tsc --noEmit
      - name: Test (+ 覆盖率门禁)
        # `npm test` = 脚本套件 + vitest --coverage;阈值写在 frontend/vitest.config.ts:
        # 全局 statements 90 / branches 85 / functions 90 / lines 95,另按 COVERAGE_PLAN §2
        # 的分组线硬卡(utils 80 / stores 70 / services 60)。未达标直接非零退出。
        run: npm test
      - name: Build
        run: npm run build
      - name: 构建产物检查(KaTeX 随包 / 体积预算 / public 资源)
        # 前端构建最容易"静默降级":KaTeX CSS 或字体没进 dist,页面公式变源码,
        # 但构建照样成功。这里断言产物里真的有 .katex 规则与字体、robots.txt 随包、
        # 单块与总量 gzip 不超预算;顺带确认后端离线导出用的 backend/static/katex 仍在。
        run: npm run check:build
