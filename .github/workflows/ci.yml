name: ci

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: backend (py${{ matrix.python }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # 主环境:CI 基线
          - os: ubuntu-latest
            python: "3.13"
          # 前瞻环境:本地开发已在 3.14 上跑,提前发现解释器差异
          - os: ubuntu-latest
            python: "3.14"
          # 项目是 Windows 优先(dev.bat / GBK 控制台 / 路径处理),必须有一条 Windows 线
          - os: windows-latest
            python: "3.13"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install dependencies
        run: python -m pip install -r backend/requirements.txt -r backend/requirements-dev.txt
      - name: Lint (ruff)
        working-directory: backend
        run: ruff check .
      - name: Compile
        run: python -m compileall -q backend
      - name: Test
        working-directory: backend
        # 覆盖率门槛只用来**防倒退**(基线 77%,门槛设 75%),
        # 不要为了数字好看去写无断言的测试。
        run: python -m pytest -q --cov --cov-report=term-missing --cov-fail-under=75

  frontend:
    name: frontend (node 22)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # vite 7 需要 20.19+/22.12+,eslint 10 需要 ^20.19/^22.13/>=24;
          # 固定在 22 这条 LTS 线上,避免 20 的小版本差异
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint (eslint)
        run: npm run lint
      - name: Type check
        run: npx vue-tsc --noEmit
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
